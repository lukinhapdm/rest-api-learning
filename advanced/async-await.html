<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consuming a REST API</title>
</head>
<body>
  <h1>REST API Consumption - Async/Await</h1>
  <h2>Fetch Posts (Modern Approach)</h2>
  <button id="getPostsAsync">Fetch Posts</button>
  <ul id="postsList"></ul>

  <script>
    // Note the 'async' keyword before the arrow function
    document.getElementById('getPostsAsync').addEventListener('click', async () => {
      const postsList = document.getElementById('postsList');
      postsList.innerHTML = 'Loading...'; // Simple visual feedback

      // 'await' pauses execution until the promise resolves
      const response = await fetch('https://jsonplaceholder.typicode.com/posts');
      const data = await response.json();

      postsList.innerHTML = ''; 
      data.slice(0, 5).forEach(post => { // Taking only the first 5 items
        const li = document.createElement('li');
        li.textContent = `${post.title}`;
        postsList.appendChild(li);
      });
    });
  </script>
</body>
</html>
