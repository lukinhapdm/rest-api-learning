<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consuming a REST API</title>
</head>
<body>
  <h1>REST API Consumption - Try/Catch</h1>
  <h2>Handling Errors</h2>
  <p>Let's try to fetch a user that doesn't exist (ID 999) to force an error.</p>

  <button id="getUserError">Fetch Non-Existent User</button>

  <!-- Elements where we display the result or error message -->
  <p id="userData" style="color: blue;"></p>
  <p id="errorMessage" style="color: red; font-weight: bold;"></p>

  <script>
    document.getElementById('getUserError').addEventListener('click', async () => {
      const errorMessageDisplay = document.getElementById('errorMessage');
      const userDataDisplay = document.getElementById('userData');

      // Clear previous messages on screen
      errorMessageDisplay.textContent = '';
      userDataDisplay.textContent = 'Fetching...';

      try {
        // Attempt to fetch user 999 (does not exist in the API)
        const response = await fetch('https://jsonplaceholder.typicode.com/users/999');
        
        // Check if the HTTP status indicates an error (e.g., 404 Not Found)
        if (!response.ok) {
          throw new Error(`Request error! HTTP Status: ${response.status}`);
        }

        const data = await response.json();
        userDataDisplay.textContent = `User found: ${data.name}`;

      } catch (error) {
        // If any error occurs in the 'try' block, execution jumps straight here
        userDataDisplay.textContent = ''; // Clear "Fetching..." text
        errorMessageDisplay.textContent = `Failed to fetch data: ${error.message}`;
      }
    });
  </script>
</body>
</html>
