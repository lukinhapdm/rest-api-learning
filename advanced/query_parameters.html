<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consuming a REST API</title>
</head>
<body>
  <h1>REST API Consumption - Query Parameters</h1>
  <h2>Filtering Results</h2>
  <p>Fetching posts belonging to User 1 only.</p>

  <button id="filterPosts">Fetch User 1 Posts</button>

  <p id="statusMessage" style="font-weight: bold;"></p>
  <ul id="filteredPostsList"></ul>

  <script>
    document.getElementById('filterPosts').addEventListener('click', async () => {
      const list = document.getElementById('filteredPostsList');
      const status = document.getElementById('statusMessage');

      // Prepare UI before the request
      list.innerHTML = ''; 
      status.textContent = 'Loading...';

      try {
        // Making the request with the query filter ?userId=1
        const response = await fetch('https://jsonplaceholder.typicode.com/posts?userId=1');
        
        // Response validation error handling
        if (!response.ok) {
           throw new Error(`Communication error: ${response.status}`);
        }

        const posts = await response.json();
        
        // Update status text with the total number of retrieved posts
        status.textContent = `Found ${posts.length} posts for User 1.`;
        
        // Create a list item (<li>) for each returned post and render to screen
        posts.forEach(post => {
          const li = document.createElement('li');
          li.textContent = `Post #${post.id}:${post.title}`;
          list.appendChild(li);
        });

      } catch (error) {
        status.textContent = 'Error fetching posts.';
        console.error('Error:', error); // Keep console log for debugging
      }
    });
  </script>
</body>
</html>
