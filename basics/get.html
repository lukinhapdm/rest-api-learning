<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consuming a REST API</title>
</head>
<body>
  <h1>REST API Consumption - GET</h1>
  <h2>Fetch All Posts</h2>
  <button id="getPosts">Fetch Posts</button>
  <ul id="postsList"></ul>

  <script>
    document.getElementById('getPosts').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/posts') // API endpoint URL
        .then(response => response.json()) // Parse the response body as JSON
        .then(data => {
          const postsList = document.getElementById('postsList');
          postsList.innerHTML = ''; // Clear the list before rendering new posts
          data.forEach(post => {
            const li = document.createElement('li');
            li.textContent = `${post.title}: ${post.body}`;
            postsList.appendChild(li);
          });
        })
        .catch(error => console.error('Error:', error)); // Log any network or parsing errors
    });
  </script>
</body>
</html>
