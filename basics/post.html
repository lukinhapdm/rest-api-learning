<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consuming a REST API</title>
</head>
<body>
  <h1>REST API Consumption - POST</h1>
  <h2>Create New Post</h2>
  <input type="text" id="postTitle" placeholder="Post title">
  <input type="text" id="postBody" placeholder="Post content">
  <button id="createPost">Create Post</button>
  <p id="responseMessage"></p>

  <script>
    document.getElementById('createPost').addEventListener('click', () => {
      const title = document.getElementById('postTitle').value;
      const body = document.getElementById('postBody').value;

      fetch('https://jsonplaceholder.typicode.com/posts', {
        method: 'POST', // HTTP method
        headers: {
          'Content-Type': 'application/json' // Specifying JSON content type
        },
        body: JSON.stringify({
          title: title,
          body: body,
          userId: 1
        }) // Converting the JavaScript object into a JSON string
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('responseMessage').textContent = `Post created with ID: ${data.id}`;
      })
      .catch(error => console.error('Error:', error)); // Log any network or parsing errors
    });
  </script>
</body>
</html>
