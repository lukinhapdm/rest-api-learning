<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consuming a REST API</title>
</head>
<body>
  <h1>REST API Consumption - PUT</h1>
  <h2>Update Existing Post</h2>
  <p>Click the button below to update post with ID 1.</p>
  <button id="updatePost">Update Post</button>
  <p id="responseMessage" style="color: blue;"></p>

  <script>
    document.getElementById('updatePost').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/posts/1', { // Specific resource URL (ID 1)
        method: 'PUT', // HTTP method for updating a full resource
        headers: {
          'Content-Type': 'application/json' // Specifying JSON content type
        },
        body: JSON.stringify({
          id: 1,
          title: 'Updated Title',
          body: 'Updated content of the post.',
          userId: 1
        }) // Converting the updated JavaScript object into a JSON string
      })
      .then(response => response.json()) // Parse the response body as JSON
      .then(data => {
        console.log('Post updated:', data);
        // Added to display the result on the page in addition to the console
        document.getElementById('responseMessage').textContent = `Success! Post updated to title: "${data.title}"`;
      })
      .catch(error => console.error('Error:', error)); // Log any network or parsing errors
    });
  </script>
</body>
</html>
